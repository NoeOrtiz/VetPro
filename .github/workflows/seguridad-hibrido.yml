name: VetPRO - pruebas de seguridad y regresión
on:
  push:
    branches:
      - seguridad/auditoria-hibrido
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas unitarias con interfaz virtual
        run: xvfb-run -a mvn -B -ntp clean test
      - name: Publicar reportes de pruebas si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/
          if-no-files-found: ignore
