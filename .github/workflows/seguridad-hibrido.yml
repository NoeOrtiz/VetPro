name: VetPRO - pruebas de seguridad y regresión
on:
  push:
    branches:
      - seguridad/auditoria-hibrido
      - integracion/estetica-companero-funciones-noe
      - integracion/pdf-sobrio-historia
      - integracion/historia-clinica-tarjeta
      - integracion/clientes-y-home-estilo-companero
      - integracion/menu-usuarios-estilo-companero
      - integracion/home-perfil-capsula
      - integracion/mi-perfil-clave-estilo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Instalar bibliotecas locales del proyecto en Maven
        run: |
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile=lib/swing-toast-notifications-1.0.3.jar \
            -DgroupId=raven.toast -DartifactId=swing-toast-notifications -Dversion=1.0.3 -Dpackaging=jar
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile=lib/picture-box-1.2.jar \
            -DgroupId=javaswingdev -DartifactId=picturebox -Dversion=1.2 -Dpackaging=jar
      - name: Compilar y ejecutar pruebas unitarias con interfaz virtual
        run: xvfb-run -a mvn -B -ntp clean test
      - name: Publicar reportes de pruebas si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Guardar ejemplos PDF sin datos reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetpro-pdf-sobrio-demo
          path: target/pdf-preview/
          if-no-files-found: ignore
