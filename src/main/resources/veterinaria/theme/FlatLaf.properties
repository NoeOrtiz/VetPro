@accentColor=$App.accent.orange

h1.font=bold +12

Component.focusWidth=1
Component.arc=10
Button.arc=10
Button.margin=4,6,4,6
ButtonForm.margin=5,5,5,5
TextComponent.arc=10
TextField.margin=4,6,4,6
PasswordField.margin=4,6,4,6
ComboBox.padding=4,6,4,6
FormattedTextField.margin=5,5,5,5
TextFieldForm.margin=5,5,5,5
ComboBoxForm.padding=5,5,5,5
TextArea.margin=3,1,3,1

Menu.header.font=$h2.font
Menu.label.font=14
Menu.foreground=#FFFFFF
Menu.scroll.width=5
Menu.scroll.trackInsets=2,0,2,1
Menu.scroll.thumbInsets=$Menu.scroll.trackInsets
Menu.icon.lightColor=rgb(240,240,240)
Menu.icon.darkColor=rgb(150,150,150)

TitlePane.unifiedBackground=false
TitlePane.buttonSize=42,30
TitlePane.buttonInsets=5,7,5,7

TableHeader.height=34
TableHeader.font=bold
Table.rowHeight=32
Table.cellMargins=2,8,2,8
TableHeader.cellMargins=2,8,2,8
ScrollPane.Table.arc=10
Table.cellFocusColor=null

ScrollBar.trackArc=999
ScrollBar.thumbArc=999
ScrollPane.TextComponent.arc=10

Popup.dropShadowInsets = 2,5,8,8

Toast.background=lighten(@background,5%)

AccentControl.show=false

# Integración híbrida: conservamos alturas de tablas y botones originales.
[style]Label.titulo = font: bold +5
[style]Label.seccion = font: bold +2
[style]Label.rotulo = font: normal
[style]Label.ayuda = foreground: $App.muted.foreground; font: -1
[style]Label.error = foreground: $App.status.error.foreground; font: -1
[style]Label.metrica = font: bold +4
[style]Panel.tarjeta = background: $App.surface.background; arc: 14; border: $App.card.border
[style]Panel.banda = background: $App.surfaceAlt.background; arc: 10; border: 8,12,8,12
[style]Panel.alerta = background: $App.status.error.background; arc: 10; border: 10,12,10,12
[style]Label.alerta = foreground: $App.status.error.foreground; font: bold

# Botones con estilo del compañero, usados sólo por las vistas originales.
[style]Button.hibridoPrimario = background: $Button.default.background; foreground: contrast($Button.default.background, #000000, #FFFFFF, 18%); hoverBackground: $Button.default.hoverBackground; pressedBackground: $Button.default.pressedBackground; borderWidth: 0; font: bold
[style]Button.hibridoSecundario = background: $App.surfaceAlt.background; hoverBackground: $App.surfaceHover.background; foreground: $Button.foreground; borderWidth: 0
[style]Button.hibridoPeligro = background: $App.status.error.background; foreground: $App.status.error.foreground; hoverBackground: $App.status.error.hoverBackground; pressedBackground: $App.status.error.pressedBackground
[style]Button.hibridoSutil = foreground: $App.muted.foreground; hoverBackground: $App.surfaceHover.background
[style]Button.hibridoAcceso = background: $App.surface.background; hoverBackground: $App.surfaceHover.background; pressedBackground: $App.surfaceAlt.background; foreground: $Label.foreground; arc: 16; borderWidth: 0
# Dos estilos optativos utilizados exclusivamente en los paneles seleccionados.
# No alteran tamaños, renderizadores ni acciones de JTable o JButton.
[style]Panel.hibridoSuperficie = background: $App.surface.background
[style]Label.hibridoTitulo = font: bold +1
[style]Table.hibridoTabla = background: $App.surface.background; alternateRowColor: $App.surfaceAlt.background
