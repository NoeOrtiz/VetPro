
@foreground=rgb(60,60,60)
@background=rgb(250,250,250)

Menu.background=rgb(21, 110, 71)
Menu.foreground=rgb(245,245,245)
Menu.lineColor=darken($Menu.foreground,25%)
Menu.arrowColor=darken($Menu.foreground,5%)
Menu.lightdark.background=darken($Menu.background,5%)
Menu.lightdark.button.background=shade($Menu.lightdark.background,20%)
Menu.title.foreground=darken($Menu.foreground,25%)
Menu.button.background=darken(@background,10%)
Menu.button.selectedBackground=#DDEFE2
Menu.button.selectedForeground=#185C32

Menu.ScrollBar.background=$Menu.background
Menu.ScrollBar.thumb=mix($Menu.background,$Menu.foreground,40%)

Login.background=darken(@background,40%)


Toast.useEffect=false

Toast.success.outlineColor=#4caf50
Toast.info.outlineColor=#03a9f4
Toast.warning.outlineColor=#ff9800
Toast.error.outlineColor=#ef5350

# Editores de fecha JCalendar / JDateChooser
TextField.foreground=@foreground
FormattedTextField.foreground=@foreground
TextField.disabledForeground=@foreground
FormattedTextField.disabledForeground=@foreground

# Accent Color
App.accent.default = #2675BF
App.accent.blue = #007AFF
App.accent.purple = #BF5AF2
App.accent.red = #FF3B30
App.accent.orange = #FF9500
App.accent.yellow = #FFCC00
App.accent.green = #28CD41
# Líneas visibles y selección en tablas con tema claro
Table.showHorizontalLines=false
Table.showVerticalLines=false
Table.gridColor=#D2D7DD
Table.selectionBackground=#FFD17A
Table.selectionForeground=#222222
Table.alternateRowColor=#F5F6F8

# Integración híbrida: conservamos alturas de tablas y botones originales.
App.surface.background=#F6F8FA
App.surfaceHover.background=#DFE7F0
App.surfaceAlt.background=darken($App.surface.background,3%)
App.borderColor=$Component.borderColor
App.muted.foreground=#53606E
App.brandColor=#84BF4E
App.status.ok.background=#DFF3E4
App.status.ok.foreground=#1E6B3A
App.status.warning.background=#FBEFD2
App.status.warning.foreground=#7A5200
App.status.error.background=#FBE4E4
App.status.error.foreground=#9B2C2C
App.status.error.hoverBackground=darken($App.status.error.background,4%)
App.status.error.pressedBackground=darken($App.status.error.background,8%)
App.avatar.background=#D5DBE1
App.avatar.foreground=#53606E
App.card.border=12,16,12,16,#D9DFE5,1,14
# Estilo uniforme de tablas, sin cambiar el contenido ni los editores.
Table.background=$App.surface.background
Table.alternateRowColor=$App.surfaceAlt.background
Table.hoverRowColor=$App.surfaceHover.background
TableHeader.background=darken($App.surface.background,2%)
TableHeader.bottomSeparatorColor=$App.borderColor
TableHeader.separatorColor=$TableHeader.background
ComboBox.background=$TextField.background
