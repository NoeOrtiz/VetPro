
@background=rgb(49,62,74)
@foreground=rgb(240,240,240)

Menu.background=darken(@background,10%)
Menu.foreground=@foreground
Menu.lineColor=lighten($Menu.background,10%)
Menu.arrowColor=lighten($Menu.background,40%)
Menu.lightdark.background=lighten($Menu.background,5%)
Menu.lightdark.button.background=tint($Menu.lightdark.background,20%)
Menu.title.foreground=darken($Menu.foreground,40%)
Menu.button.background=lighten(@background,5%)
Menu.button.selectedBackground=#273A33
Menu.button.selectedForeground=#E8F8EA

Menu.ScrollBar.background=$Menu.background
Menu.ScrollBar.thumb=lighten($Menu.background,10%)

Login.background=lighten(@background,5%)

Toast.success.outlineColor=#1b5e20
Toast.info.outlineColor=#01579b
Toast.warning.outlineColor=#e65100
Toast.error.outlineColor=#c62828

# Editores de fecha JCalendar / JDateChooser
TextField.foreground=@foreground
FormattedTextField.foreground=@foreground
TextField.disabledForeground=@foreground
FormattedTextField.disabledForeground=@foreground

# Accent Color
App.accent.default = #4B6EAF
App.accent.blue = #0A84FF
App.accent.purple = #BF5AF2
App.accent.red = #FF453A
App.accent.orange = #FF9F0A
App.accent.yellow = #FFCC00
App.accent.green = #32D74B
# Líneas y selección de tablas con tema oscuro
Table.showHorizontalLines=false
Table.showVerticalLines=false
Table.gridColor=#515B64
Table.selectionBackground=#456E79
Table.selectionForeground=#FFFFFF

# Integración híbrida: conservamos alturas de tablas y botones originales.
App.surface.background=darken(@background,5%)
App.surfaceHover.background=lighten($App.surface.background,6%)
App.surfaceAlt.background=lighten($App.surface.background,2%)
App.borderColor=$Component.borderColor
App.muted.foreground=#B9C3CD
App.brandColor=#84BF4E
App.status.ok.background=#1F4D3A
App.status.ok.foreground=#8FE3BA
App.status.warning.background=#574520
App.status.warning.foreground=#F2CD7A
App.status.error.background=#55343A
App.status.error.foreground=#F3A9A9
App.status.error.hoverBackground=lighten($App.status.error.background,6%)
App.status.error.pressedBackground=lighten($App.status.error.background,10%)
App.avatar.background=lighten(@background,14%)
App.avatar.foreground=#DEE5EA
App.card.border=12,16,12,16
# Tablas como las del compañero, con casillas y acciones del modelo original.
Table.background=$App.surface.background
Table.alternateRowColor=$App.surfaceAlt.background
Table.hoverRowColor=$App.surfaceHover.background
TableHeader.background=darken($App.surface.background,3%)
TableHeader.bottomSeparatorColor=$App.borderColor
TableHeader.separatorColor=$TableHeader.background
ComboBox.background=$TextField.background
